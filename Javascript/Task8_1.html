<!DOCTYPE html>

<html>
<head>
    <title>Farmer Registration</title>
</head>
<body>

<h1>Farmer Registration Form</h1>

<form>

Farmer Name: <input type="text" name="name"> <br><br>

Mobile Number: <input type="text" name="mobile"> <br><br>

Email Address: <input type="email" name="email"> <br><br>

Village: <input type="text" name="village"> <br><br>

Plot ID: <input type="text" name="plot"> <br><br>

Crop Variety: <input type="text" name="crop"> <br><br>

Farm Area: <input type="text" name="area"> <br><br>

Irrigation Method: <select name="irrigation"> <option>Select</option> <option>Drip Irrigation</option> <option>Sprinkler Irrigation</option> <option>Flood Irrigation</option> </select> <br><br>

Preferred Language: <input type="radio" name="language" value="English"> English <input type="radio" name="language" value="Hindi"> Hindi <input type="radio" name="language" value="Marathi"> Marathi <br><br>

Advisory Services Required: <br> <input type="checkbox" name="service"> Weather Updates <br> <input type="checkbox" name="service"> Crop Advisory <br> <input type="checkbox" name="service"> Market Prices <br> <input type="checkbox" name="service"> Irrigation Advice <br><br>

<input type="submit" value="Submit">
<input type="reset" value="Reset">

</form>

</body>
</html>
